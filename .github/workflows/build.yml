name: Build

# The unconditional gate for the web UI (docs/refactor/02-execution-order.md, Phase 0, item P1).
#
# `npm run build` in web/ is `tsc -b && vite build`, and web/tsconfig.json already runs strict with
# noUnusedLocals + noUnusedParameters + noFallthroughCasesInSwitch. That typecheck currently passes with
# zero errors — but nothing holds it there, because nothing runs it. This does.
#
# The Android/Capacitor half (npm run apk) stays with release-apk.yml: it needs the Android SDK and a
# Gradle build, which is minutes of CI per push for a shell that changes far less often than web/.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Typecheck and build
        working-directory: web
        run: npm run build
